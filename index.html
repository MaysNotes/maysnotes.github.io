<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Najma</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
    <link rel="stylesheet" href="./fonts/fonts.css">

</head>

<body>

    <main class="home-container">

        <header class="site-header">

            <h1>Najma</h1>

            <p>
                Tulisan, catatan, dan refleksi.
            </p>

        </header>


        <section class="search-section">

            <label
                for="search-input"
                class="visually-hidden"
            >
                Cari artikel
            </label>

            <input
                type="search"
                id="search-input"
                placeholder="Cari tulisan..."
                autocomplete="off"
            >

        </section>


        <button
            id="back-to-latest"
            class="back-to-latest"
            type="button"
            hidden
        >
            ← Tulisan Terbaru
        </button>


        <section class="latest-section">
            <h2>Tulisan Terbaru</h2>

            <div id="latest-articles"></div>

            <nav
                id="latest-pagination"
                class="pagination"
                aria-label="Navigasi halaman artikel"
            >
            </nav>
        </section>


        <section id="search-results" class="search-results" hidden>
            <h2 id="search-result-heading">
                Hasil Pencarian
            </h2>

            <div id="search-result-list"></div>

            <nav
                id="search-pagination"
                class="pagination"
                aria-label="Navigasi hasil pencarian"
            ></nav>
        </section>
        
    </main>


    <script src="js/search.js"></script>
    <script src="js/temp-func.js"></script>

</body>

</html>
