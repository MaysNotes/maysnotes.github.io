<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>May's Notes</title>


    <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
    <link rel="shortcut icon" href="./favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./favicon/site.webmanifest" />

    <link
        rel="stylesheet"
        href="css/style.css"
    >
    <link rel="stylesheet" href="./fonts/fonts.css">

    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0d0f12">

    <!-- Theme initialization -->
    <script>
        (() => {
            const savedTheme = localStorage.getItem("theme");
            const systemPrefersLight =
                window.matchMedia("(prefers-color-scheme: light)").matches;

            const theme =
                savedTheme || (systemPrefersLight ? "light" : "dark");

            document.documentElement.dataset.theme = theme;
        })();
    </script>

</head>

<body>

    <main class="home-container">

        <header class="site-header">

            <button
                id="theme-toggle"
                type="button"
                aria-label="Switch to light theme"
            >
                <span aria-hidden="true">☾</span>
            </button>

            <h1>May's Notes</h1>

            <p>
                Najma’s thoughts and reflections.
            </p>


        </header>


        <section class="search-section">

            <label
                for="search-input"
                class="visually-hidden"
            >
                Cari artikel
            </label>

            <input
                type="search"
                id="search-input"
                placeholder="Cari tulisan..."
                autocomplete="off"
            >

        </section>


        <button
            id="back-to-latest"
            class="back-to-latest"
            type="button"
            hidden
        >
            ← Tulisan Terbaru
        </button>


        <section class="latest-section">
            <h2>Tulisan Terbaru</h2>

            <div id="latest-articles"></div>

            <nav
                id="latest-pagination"
                class="pagination"
                aria-label="Navigasi halaman artikel"
            >
            </nav>
        </section>


        <section id="search-results" class="search-results" hidden>
            <h2 id="search-result-heading">
                Hasil Pencarian
            </h2>

            <div id="search-result-list"></div>

            <nav
                id="search-pagination"
                class="pagination"
                aria-label="Navigasi hasil pencarian"
            ></nav>
        </section>

    </main>


    <script src="js/script.js"></script>
    <script src="js/search.js"></script>
    <script src="js/temp-func.js"></script>

</body>

</html>
